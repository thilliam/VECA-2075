name: Summarize GA east rail foundation

on:
  push:
    paths:
      - "tools/summarize_ga_rail.py"
      - ".github/workflows/summarize-ga-rail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Summarize committed rail layer
        run: python tools/summarize_ga_rail.py
      - name: Commit rail summary
        run: |
          git config user.name "VECA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/transport/ga_rail_east_summary.csv research/transport/rail_foundation_validation.md
          if git diff --cached --quiet; then
            echo "No rail summary changes"
          else
            git commit -m "EXP-001: enrich GA rail foundation summary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
