name: Profile Essential Energy capacity data
on:
  push:
    branches: [feature/ingest-essential-energy-capacity-001]
    paths: [".github/workflows/profile-essential-energy-capacity.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/ingest-essential-energy-capacity-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download authoritative Essential Energy capacity workbook
        run: |
          mkdir -p _scratch/essential assurance/source_profiles
          curl --fail --location --retry 3 'https://dapr.essentialenergy.com.au/DAPR%202025%20BSP%2C%20ZS%20and%20Lines%20Extract%20Summary%20-%20V2.xlsx' -o _scratch/essential/dapr-2025-bsp-zs-lines.xlsx
      - name: Profile workbook
        run: |
          python tools/profile_xlsx_stdlib.py _scratch/essential/dapr-2025-bsp-zs-lines.xlsx assurance/source_profiles/essential_energy_bsp_zs_lines_2025.json --max-rows 30
      - name: Publish profile
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_profiles/essential_energy_bsp_zs_lines_2025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: profile Essential Energy BSP and zone-substation workbook"
          git pull --rebase --autostash origin feature/ingest-essential-energy-capacity-001
          git push origin HEAD:feature/ingest-essential-energy-capacity-001
