name: Profile Essential Energy capacity data
on:
  push:
    branches: [feature/ingest-essential-energy-capacity-001]
    paths: [".github/workflows/profile-essential-energy-capacity.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/ingest-essential-energy-capacity-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download authoritative Essential Energy workbooks
        run: |
          mkdir -p _scratch/essential assurance/source_profiles
          curl --fail --location --retry 3 'https://www.essentialenergy.com.au/-/media/Project/EssentialEnergy/Website/Files/Our-Network/DAPR-2025-BSP-ZS-and-Lines-Extract-Summary.xlsx?rev=d7dec446d19e43ee890c8b2b08f81a18' -o _scratch/essential/dapr-2025-bsp-zs-lines.xlsx
          curl --fail --location --retry 3 'https://www.essentialenergy.com.au/-/media/Project/EssentialEnergy/Website/Files/Our-Network/DAPR-2025-Limitations-Annual-Data-Essential-Energy.xlsx?rev=e5fe69766508411687227c125b7562be' -o _scratch/essential/dapr-2025-limitations-annual.xlsx
      - name: Profile workbooks
        run: |
          python tools/profile_xlsx_stdlib.py _scratch/essential/dapr-2025-bsp-zs-lines.xlsx assurance/source_profiles/essential_energy_bsp_zs_lines_2025.json --max-rows 25
          python tools/profile_xlsx_stdlib.py _scratch/essential/dapr-2025-limitations-annual.xlsx assurance/source_profiles/essential_energy_limitations_annual_2025.json --max-rows 20
      - name: Publish profiles
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_profiles/essential_energy_bsp_zs_lines_2025.json assurance/source_profiles/essential_energy_limitations_annual_2025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: profile Essential Energy DAPR capacity data"
          git pull --rebase --autostash origin feature/ingest-essential-energy-capacity-001
          git push origin HEAD:feature/ingest-essential-energy-capacity-001
