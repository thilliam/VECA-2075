name: Extract Ergon substation load summaries
on:
  push:
    branches: [feature/ingest-ergon-substation-load-001]
    paths:
      - "tools/extract_ergon_substation_load.py"
      - ".github/workflows/extract-ergon-substation-load.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ingest-ergon-substation-load-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Extract and reconcile
        run: |
          python tools/extract_ergon_substation_load.py \
            research/energy/Ergon-Network-Substation-Load-Data-2025-26.zip \
            domains/energy/data/derived/ergon_zone_substation_load_summary_2025-26.csv \
            assurance/reconciliation/ergon_zone_substation_load_2025-26.json \
            --inventory-profile assurance/source_profiles/ergon_substation_load_2025-26.json
      - name: Publish outputs
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add domains/energy/data/derived/ergon_zone_substation_load_summary_2025-26.csv assurance/reconciliation/ergon_zone_substation_load_2025-26.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: materialise Ergon zone-substation load summary"
          git pull --rebase --autostash origin feature/ingest-ergon-substation-load-001
          git push origin HEAD:feature/ingest-ergon-substation-load-001
