name: Reconcile direct VECA imports

on:
  push:
    branches:
      - feature/assurance-complete-existing-sets
    paths:
      - "tools/reconcile_direct_imports.py"
      - "data/derived/population_sa2_east.csv"
      - "data/derived/transport/ga_major_roads_east.geojson"
      - "data/derived/transport/ga_rail_east.geojson"
      - ".github/workflows/reconcile-direct-imports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/assurance-complete-existing-sets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Reconcile direct imports
        run: python tools/reconcile_direct_imports.py
      - name: Validate assurance manifests
        run: python tools/validate_source_assurance.py --strict
      - name: Commit reconciliation outputs
        run: |
          git config user.name "VECA assurance bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/direct_import_reconciliation.json assurance/manifests/POP-ABS-SA2-ERP-2001-2025.json assurance/manifests/TRANSPORT-GA-EAST-MAJOR-ROADS.json assurance/manifests/TRANSPORT-GA-EAST-RAIL.json
          if git diff --cached --quiet; then
            echo "No reconciliation changes"
          else
            git commit -m "Assurance: reconcile ABS and GA direct imports"
            git pull --rebase origin feature/assurance-complete-existing-sets
            git push origin HEAD:feature/assurance-complete-existing-sets
          fi
