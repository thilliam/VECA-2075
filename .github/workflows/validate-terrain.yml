name: Validate EXP-002 terrain

on:
  pull_request:
    paths:
      - "tools/build_terrain_screen.py"
      - "tools/requirements-terrain.txt"
      - "tests/test_terrain_screen.py"
      - "maps/poc-006/**"
      - "experiments/EXP-002-habitat-resource-screening/terrain_buildability_v1.md"
      - ".github/workflows/validate-terrain.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install terrain dependencies
        run: python -m pip install -r tools/requirements-terrain.txt
      - name: Run terrain regression tests
        run: python -m unittest tests.test_terrain_screen
