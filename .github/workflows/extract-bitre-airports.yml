name: Extract BITRE airport history

on:
  push:
    paths:
      - "tools/extract_bitre_airports.py"
      - ".github/workflows/extract-bitre-airports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas openpyxl requests tabulate
      - name: Extract BITRE airport history
        run: python tools/extract_bitre_airports.py
      - name: Commit derived airport history
        run: |
          git config user.name "VECA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/transport/airport_activity_1985_2025.csv research/transport/airport_activity_validation.md
          if git diff --cached --quiet; then
            echo "No derived airport changes"
          else
            git commit -m "EXP-001: materialise BITRE airport history"
            git push
          fi
