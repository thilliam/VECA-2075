name: Apply Ergon zone-substation load assurance
on:
  push:
    branches: [feature/ingest-ergon-substation-load-001]
    paths:
      - "assurance/ingestion_batches/ergon_zone_substation_load_2025-26.json"
      - ".github/workflows/apply-ergon-assurance-batch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ingest-ergon-substation-load-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/apply_assurance_batch.py assurance/ingestion_batches/ergon_zone_substation_load_2025-26.json
      - run: python tools/validate_dataset_register.py
      - run: python tools/validate_source_assurance.py --strict
      - name: Publish canonical assurance state
        run: |
          git config user.name "VECA assurance bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_register.json assurance/dataset_register.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assurance: register Ergon zone-substation load dataset"
          git pull --rebase --autostash origin feature/ingest-ergon-substation-load-001
          git push origin HEAD:feature/ingest-ergon-substation-load-001
