name: Extract GA east rail foundation

on:
  push:
    paths:
      - "tools/extract_ga_east_rail.py"
      - "tools/summarize_ga_rail.py"
      - ".github/workflows/extract-ga-rail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Extract rail foundation
        run: python tools/extract_ga_east_rail.py
      - name: Summarize and validate rail foundation
        run: python tools/summarize_ga_rail.py
      - name: Commit derived rail layer
        run: |
          git config user.name "VECA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/transport/ga_rail_east.geojson data/derived/transport/ga_rail_east_summary.csv research/transport/rail_foundation_validation.md
          if git diff --cached --quiet; then
            echo "No derived rail changes"
          else
            git commit -m "EXP-001: materialise GA east rail foundation layer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
