name: Extract Ausgrid capacity assets
on:
  push:
    branches: [feature/ingest-ausgrid-capacity-001]
    paths:
      - "tools/extract_ausgrid_substation_capacity.py"
      - ".github/workflows/extract-ausgrid-capacity.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/ingest-ausgrid-capacity-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download authoritative workbook
        run: |
          mkdir -p _scratch/ausgrid assurance/inventories assurance/reconciliation domains/energy/data/derived
          curl --fail --location --retry 3 \
            'https://aopt-p-001.sitecorecontenthub.cloud/api/public/content/2f1a73b7329b4496bac54d39bbc02e9c?v=ecf15b51' \
            -o _scratch/ausgrid/substation-capacity-demand-forecast-2025.xlsx
      - name: Independent asset inventory with openpyxl
        run: |
          python -m pip install --disable-pip-version-check --quiet openpyxl
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import openpyxl
          wb=openpyxl.load_workbook('_scratch/ausgrid/substation-capacity-demand-forecast-2025.xlsx',read_only=True,data_only=False)
          ids=[]; counts={}
          for short,atype in [('ZS','zone_substation'),('STS','subtransmission_substation')]:
              ws=wb[f'Tech Spec ({short})']
              n=0
              for row in ws.iter_rows(min_row=7,values_only=True):
                  name=str(row[1] or '').strip().upper(); voltage=str(row[2] or '').strip()
                  if not name: continue
                  ids.append(f'{atype}|{name}|{voltage}');n+=1
              counts[atype]=n
          c=Counter(ids);dup=sorted(k for k,v in c.items() if v>1)
          payload={'source':'Ausgrid 2025 Substation Capacity and Demand Forecast','inventory_method':'openpyxl Tech Spec ZS/STS independent read','independent_from_extraction':True,'expected_count':len(ids),'asset_type_counts':counts,'duplicate_source_record_ids':dup,'source_record_ids':sorted(c)}
          assert not dup
          Path('assurance/inventories/ausgrid_substation_capacity_2025_ids.json').write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='source_record_ids'},indent=2))
          PY
      - name: Extract and reconcile with stdlib implementation
        run: |
          python tools/extract_ausgrid_substation_capacity.py \
            _scratch/ausgrid/substation-capacity-demand-forecast-2025.xlsx \
            assurance/inventories/ausgrid_substation_capacity_2025_ids.json \
            domains/energy/data/derived/ausgrid_substation_capacity_demand_2025.csv \
            assurance/reconciliation/ausgrid_substation_capacity_demand_2025.json
      - name: Publish outputs
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/inventories/ausgrid_substation_capacity_2025_ids.json assurance/reconciliation/ausgrid_substation_capacity_demand_2025.json domains/energy/data/derived/ausgrid_substation_capacity_demand_2025.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: materialise Ausgrid substation capacity and demand"
          git pull --rebase --autostash origin feature/ingest-ausgrid-capacity-001
          git push origin HEAD:feature/ingest-ausgrid-capacity-001
