name: Extract ABS population

on:
  push:
    paths:
      - "tools/extract_abs_population.py"
      - ".github/workflows/extract-population.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extractor dependencies
        run: pip install pandas openpyxl requests tabulate
      - name: Extract and validate population data
        run: python tools/extract_abs_population.py
      - name: Commit derived population layer
        run: |
          git config user.name "VECA data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/derived/population_sa2_east.csv data/derived/population_state_validation.csv research/population/population_validation.md
          if git diff --cached --quiet; then
            echo "No derived population changes"
          else
            git commit -m "EXP-001: materialise ABS 2025 SA2 population layer"
            git push
          fi
