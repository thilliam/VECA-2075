name: Apply water assurance batch
on:
  push:
    branches: [feature/complete-regional-water-systems-001]
    paths:
      - "assurance/ingestion_batches/regional_water_completion_2026.json"
      - ".github/workflows/apply-water-assurance-batch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/complete-regional-water-systems-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/apply_assurance_batch.py assurance/ingestion_batches/regional_water_completion_2026.json
      - run: python tools/audit_current_datasets.py
      - run: python tools/validate_dataset_register.py
      - run: python tools/validate_source_assurance.py --strict
      - name: Publish canonical assurance state
        run: |
          git config user.name "VECA assurance bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_register.json assurance/current_dataset_audit.json assurance/current_dataset_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assurance: register regional water completion"
          git pull --rebase --autostash origin feature/complete-regional-water-systems-001
          git push origin HEAD:feature/complete-regional-water-systems-001
