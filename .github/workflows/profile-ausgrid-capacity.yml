name: Profile Ausgrid capacity forecast
on:
  push:
    branches: [feature/ingest-ausgrid-capacity-001]
    paths: [".github/workflows/profile-ausgrid-capacity.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/ingest-ausgrid-capacity-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download authoritative Ausgrid datasheet
        run: |
          mkdir -p _scratch/ausgrid assurance/source_profiles
          curl --fail --location --retry 3 \
            'https://aopt-p-001.sitecorecontenthub.cloud/api/public/content/2f1a73b7329b4496bac54d39bbc02e9c?v=ecf15b51' \
            -o _scratch/ausgrid/substation-capacity-demand-forecast-2025.xlsx
      - name: Profile workbook
        run: |
          python tools/profile_xlsx_stdlib.py _scratch/ausgrid/substation-capacity-demand-forecast-2025.xlsx assurance/source_profiles/ausgrid_substation_capacity_demand_2025.json --max-rows 30
      - name: Publish profile
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_profiles/ausgrid_substation_capacity_demand_2025.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: profile Ausgrid substation capacity forecast"
          git pull --rebase --autostash origin feature/ingest-ausgrid-capacity-001
          git push origin HEAD:feature/ingest-ausgrid-capacity-001
