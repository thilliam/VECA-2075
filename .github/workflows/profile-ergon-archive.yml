name: Profile pushed Ergon source archive
on:
  push:
    branches: [feature/ingest-ergon-substation-load-001]
    paths:
      - "tools/profile_archive.py"
      - ".github/workflows/profile-ergon-archive.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ingest-ergon-substation-load-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Profile Ergon archive
        run: |
          python tools/profile_archive.py \
            research/energy/Ergon-Network-Substation-Load-Data-2025-26.zip \
            assurance/source_profiles/ergon_substation_load_2025-26.json
      - name: Publish profile
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_profiles/ergon_substation_load_2025-26.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: profile Ergon substation source archive"
          git pull --rebase --autostash origin feature/ingest-ergon-substation-load-001
          git push origin HEAD:feature/ingest-ergon-substation-load-001
