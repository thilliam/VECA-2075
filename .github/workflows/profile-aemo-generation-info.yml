name: Profile AEMO generation information
on:
  push:
    branches: [feature/ingest-aemo-generation-assets-001]
    paths:
      - ".github/workflows/profile-aemo-generation-info.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/ingest-aemo-generation-assets-001, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download AEMO July 2026 generation workbook
        run: |
          mkdir -p _scratch/aemo assurance/source_profiles
          curl --fail --location --retry 3 \
            'https://www.aemo.com.au/-/media/files/electricity/nem/planning_and_forecasting/generation_information/2026/nem-generation-information-july-2026.xlsx?rev=3455851f2bc945b7ab61c5ceed272992&sc_lang=en' \
            -o _scratch/aemo/nem-generation-information-july-2026.xlsx
      - name: Profile workbook
        run: |
          python tools/profile_xlsx_stdlib.py \
            _scratch/aemo/nem-generation-information-july-2026.xlsx \
            assurance/source_profiles/aemo_generation_information_july_2026.json \
            --max-rows 20
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('assurance/source_profiles/aemo_generation_information_july_2026.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          sheet=next(s for s in data['sheets'] if s['name']=='Generator Information')
          Path('assurance/source_profiles/aemo_generator_information_sheet_2026.json').write_text(json.dumps(sheet, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Publish profile
        run: |
          git config user.name "VECA ingestion bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_profiles/aemo_generation_information_july_2026.json assurance/source_profiles/aemo_generator_information_sheet_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Energy: profile AEMO Generator Information sheet"
          git pull --rebase --autostash origin feature/ingest-aemo-generation-assets-001
          git push origin HEAD:feature/ingest-aemo-generation-assets-001
