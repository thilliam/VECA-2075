name: Validate VECA assurance

on:
  pull_request:
    paths:
      - "assurance/**"
      - "data/derived/**"
      - "domains/*/data/derived/**"
      - "domains/*/research/source_register.csv"
      - "research/source_register.csv"
      - "maps/layers/catalogue.json"
      - "tools/validate_*assurance.py"
      - "tools/validate_dataset_register.py"
      - "tools/validate_spatial_readiness.py"
      - "tests/test_*assurance.py"
      - "tests/test_dataset_register.py"
      - ".github/workflows/validate-assurance.yml"
  push:
    branches:
      - main
    paths:
      - "assurance/**"
      - "data/derived/**"
      - "domains/*/data/derived/**"
      - "domains/*/research/source_register.csv"
      - "research/source_register.csv"
      - "maps/layers/catalogue.json"
      - "tools/validate_*assurance.py"
      - "tools/validate_dataset_register.py"
      - "tools/validate_spatial_readiness.py"
      - "tests/test_*assurance.py"
      - "tests/test_dataset_register.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source assurance
        run: python tools/validate_source_assurance.py --strict
      - name: Validate dataset registry
        run: python tools/validate_dataset_register.py
      - name: Validate spatial readiness
        run: python tools/validate_spatial_readiness.py
      - name: Run assurance regression tests
        run: python -m unittest tests.test_source_assurance tests.test_dataset_register
