name: Apply compute assurance batch

on:
  push:
    branches: [feature/ingest-compute-pipeline-001]
    paths:
      - "assurance/ingestion_batches/compute_pipeline_2026.json"
      - ".github/workflows/apply-compute-assurance-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ingest-compute-pipeline-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/apply_assurance_batch.py assurance/ingestion_batches/compute_pipeline_2026.json
      - run: python tools/validate_dataset_register.py
      - run: python tools/validate_source_assurance.py --strict
      - name: Publish canonical registers
        run: |
          git config user.name "VECA assurance bot"
          git config user.email "actions@users.noreply.github.com"
          git add assurance/source_register.json assurance/dataset_register.json assurance/curated_dataset_contracts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Assurance: register compute pipeline ingestion batch"
          git pull --rebase --autostash origin feature/ingest-compute-pipeline-001
          git push origin HEAD:feature/ingest-compute-pipeline-001
